[package]
name = "rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
flatbuffers = "25.12.19"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
bytes = "1"
crc32fast = "1.5.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
futures-util = { version = "0.3", features = ["sink"] }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "ping_pong"
harness = false

[[bench]]
name = "pipeline"
harness = false